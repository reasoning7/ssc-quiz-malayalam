<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>IFS Goal - GK Master Quiz</title>
    <style>
        :root { --primary: #0984e3; --success: #27ae60; --error: #d63031; }
        
        body { 
            font-family: 'Poppins', sans-serif; 
            margin: 0;
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            /* Motivated Background Image: Focused study for success */
            background: linear-gradient(rgba(0, 0, 0, 0.7), rgba(0, 0, 0, 0.7)), 
                        url('https://images.unsplash.com/photo-1434030216411-0b793f4b4173?ixlib=rb-1.2.1&auto=format&fit=crop&w=1350&q=80');
            background-size: cover;
            background-position: center;
        }

        .quiz-container {
            background: rgba(255, 255, 255, 0.98);
            width: 95%;
            max-width: 550px;
            padding: 30px;
            border-radius: 25px;
            box-shadow: 0 20px 50px rgba(0,0,0,0.5);
            text-align: center;
            border: 4px solid var(--primary);
        }

        #timer-display { 
            font-weight: bold; 
            font-size: 1.5rem; 
            color: var(--error); 
            background: #ffeaa7;
            padding: 10px;
            border-radius: 15px;
            margin-bottom: 20px;
            display: inline-block;
        }

        .question { font-size: 1.4rem; font-weight: 700; color: #2d3436; margin-bottom: 25px; }

        .options { display: grid; gap: 15px; }

        .option-btn {
            padding: 15px;
            border: 2px solid #dfe6e9;
            border-radius: 12px;
            background: #fff;
            cursor: pointer;
            transition: 0.3s;
            font-size: 1.1rem;
            font-weight: 500;
        }

        .option-btn:hover { border-color: var(--primary); background: #f1f2f6; transform: scale(1.02); }

        .correct { background-color: var(--success) !important; color: white; border-color: var(--success); }
        .wrong { background-color: var(--error) !important; color: white; border-color: var(--error); }

        #next-btn {
            margin-top: 25px;
            padding: 15px 40px;
            background: var(--primary);
            color: white;
            border: none;
            border-radius: 10px;
            display: none;
            cursor: pointer;
            font-size: 1.2rem;
            font-weight: bold;
        }

        .result-card { display: none; }
        .result-card h2 { color: var(--primary); font-size: 2.2rem; margin-bottom: 10px; }
        .score-circle {
            width: 120px; height: 120px;
            line-height: 120px;
            border-radius: 50%;
            background: linear-gradient(135deg, #6c5ce7, #0984e3);
            color: white;
            font-size: 2rem;
            margin: 20px auto;
            box-shadow: 0 10px 20px rgba(9, 132, 227, 0.3);
        }
    </style>
</head>
<body>

<audio id="sound-correct" src="https://assets.mixkit.co/active_storage/sfx/2000/2000-preview.mp3"></audio>
<audio id="sound-wrong" src="https://assets.mixkit.co/active_storage/sfx/2019/2019-preview.mp3"></audio>
<audio id="sound-timer" src="https://assets.mixkit.co/active_storage/sfx/642/642-preview.mp3" loop></audio>

<div class="quiz-container">
    <div id="quiz-section">
        <div id="timer-display">⏳ 10s</div>
        <div id="question-box" class="question">Ready to start?</div>
        <div id="options-box" class="options"></div>
        <button id="next-btn" onclick="nextQuestion()">Next Question ➜</button>
    </div>

    <div id="result-section" class="result-card">
        <h2>🎉 Mission Accomplished!</h2>
        <p>Your hard work is paying off.</p>
        <div class="score-circle" id="final-score">0</div>
        <p id="feedback">Keep pushing! Your appointment letter is within reach.</p>
        <button onclick="location.reload()" style="padding:12px 25px; cursor:pointer; border-radius:10px; border:none; background:#2d3436; color:#fff;">Try Again</button>
    </div>
</div>

{ q: "What is the chemical name for Common Salt?", a: "Sodium Chloride", options: ["Sodium Bicarbonate", "Sodium Chloride", "Potassium Nitrate", "Calcium Carbonate"] },

{ q: "Which is the smallest state of India by area?", a: "Goa", options: ["Sikkim", "Goa", "Tripura", "Manipur"] },
{ q: "What is the pH value of pure water?", a: "7", options: ["5", "6", "7", "8"] },
{ q: "Who wrote 'Jai Hind' for the first time?", a: "Abid Hasan", options: ["Subhash Chandra Bose", "Abid Hasan", "Bhagat Singh", "Sardar Patel"] },

        // ------
        { q: "Who was the founder of the Maurya Empire?", a: "Chandragupta Maurya", options: ["Ashoka", "Chandragupta Maurya", "Bindusara", "Harsha"] },
        { q: "Which planet is known as the Red Planet?", a: "Mars", options: ["Venus", "Mars", "Jupiter", "Saturn"] },

    ];

    let currentIdx = 0;
    let timer;
    let timeLeft = 10;
    let score = 0;

    const sCorrect = document.getElementById('sound-correct');
    const sWrong = document.getElementById('sound-wrong');
    const sTimer = document.getElementById('sound-timer');

    function loadQuestion() {
        clearInterval(timer);
        timeLeft = 10;
        document.getElementById('timer-display').innerText = `⏳ ${timeLeft}s`;
        document.getElementById('next-btn').style.display = 'none';
        
        const data = quizData[currentIdx];
        document.getElementById('question-box').innerText = `${currentIdx + 1}. ${data.q}`;
        const optionsBox = document.getElementById('options-box');
        optionsBox.innerHTML = '';
        
        data.options.forEach(opt => {
            const btn = document.createElement('button');
            btn.className = 'option-btn';
            btn.innerText = opt;
            btn.onclick = () => checkAnswer(btn, opt, data.a);
            optionsBox.appendChild(btn);
        });
        
        sTimer.play(); // Timer sound starts
        startTimer();
    }

    function startTimer() {
        timer = setInterval(() => {
            timeLeft--;
            document.getElementById('timer-display').innerText = `⏳ ${timeLeft}s`;
            if (timeLeft <= 0) {
                sTimer.pause();
                clearInterval(timer);
                showCorrect();
                document.getElementById('next-btn').style.display = 'inline-block';
            }
        }, 1000);
    }

    function checkAnswer(btn, selected, correct) {
        clearInterval(timer);
        sTimer.pause();
        sTimer.currentTime = 0;
        
        const allBtns = document.querySelectorAll('.option-btn');
        if (selected === correct) {
            btn.classList.add('correct');
            sCorrect.play();
            score++;
        } else {
            btn.classList.add('wrong');
            sWrong.play();
            showCorrect();
        }
        allBtns.forEach(b => b.disabled = true);
        document.getElementById('next-btn').style.display = 'inline-block';
    }

    function showCorrect() {
        const correct = quizData[currentIdx].a;
        document.querySelectorAll('.option-btn').forEach(b => {
            if(b.innerText === correct) b.classList.add('correct');
        });
    }

    function nextQuestion() {
        currentIdx++;
        if (currentIdx < quizData.length) {
            loadQuestion();
        } else {
            showResult();
        }
    }

    function showResult() {
        document.getElementById('quiz-section').style.display = 'none';
        document.getElementById('result-section').style.display = 'block';
        document.getElementById('final-score').innerText = `${score}/${quizData.length}`;
    }

    loadQuestion();
</script>
</body>
</html>
